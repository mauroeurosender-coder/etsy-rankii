<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>EtsyRanker AI</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        width: 260px;
        margin: 0;
        padding: 16px;
        color: #1e293b;
      }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { font-size: 12px; color: #64748b; line-height: 1.5; margin: 0 0 12px; }
      button {
        width: 100%;
        padding: 8px 12px;
        background: #f97316;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #ea580c; }
      .status { font-size: 11px; font-weight: 700; padding: 6px 8px; border-radius: 6px; margin-bottom: 10px; }
      .active { background: #dcfce7; color: #166534; }
      .inactive { background: #f1f5f9; color: #64748b; }
    </style>
  </head>
  <body>
    <h1>EtsyRanker AI</h1>
    <div id="status" class="status inactive">Checking this tab...</div>
    <p>Open any Etsy listing page to see the insights panel appear automatically in the bottom-right corner.</p>
    <button id="settings">Settings</button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
